<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>叮当图书网</title>
    <style>
        *{
            text-align: center;
        }
        header,footer,section{
            margin: 20px 0px;
        }
        p{
            text-align: left;
            text-indent:2em;
        }
        table{
            width: 95%;
            border:1px solid #c3dcf5;
            margin: 10px auto;
            border-collapse: collapse;
        }
        caption{
            color:#666;
            font-size:1.5em;/*设置字体大小为初始化时的1.5倍*/
        }
        /*奇数行*/
        table tr:nth-child(odd){
          background:#ebf5ff;
       }
        /*偶数行*/
        table tr:nth-child(even){
        }
        .price{
            color:#999;
            text-decoration:line-through;
        }
        .bn{
            display:block;
            text-decoration:none;
            width:65px;
            height: 30px;
            line-height: 30px;
            margin:0 auto;
            background:#C30;
            color :#FFF;
            border-radius:5px;
        }
        .bn:hover{
            background: #FC0;
            color:#333;
        }
        th{
            color:#5591be;
            background:#ebf5ff;
            padding :4px 14px;
        }
        td{
            color:#678197;
            border:1px solid #c3dcf5;
            padding:4px 14px;
        }
    </style>
</head>
